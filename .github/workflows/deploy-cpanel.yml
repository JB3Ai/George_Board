name: Deploy to cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets['SUPABASE_URL'] }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets['SUPABASE_ANON_KEY'] }}

      - name: Include Apache rules in dist
        run: cp .htaccess dist/.htaccess

      - name: Deploy dist to cPanel via FTP (configured target)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./public_html/clipboard/
          timeout: 600000
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/.git*
            **/node_modules/**
            **/.DS_Store

