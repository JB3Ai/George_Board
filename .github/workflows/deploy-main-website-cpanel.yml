name: Deploy Main Website to cPanel

on:
  push:
    branches: ["main"]
    paths:
      - "jb3ai-landing/**"
      - ".github/workflows/deploy-main-website-cpanel.yml"
  workflow_dispatch:

jobs:
  deploy-main-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static site to cPanel root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./jb3ai-landing/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/clipboard/**
            **/os3grid/**
            **/os3grid-telephone/**
            **/demo/**
            **/brochures/**