<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#080D14"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A4A5C"/>
      <stop offset="50%" stop-color="#5A6A7C"/>
      <stop offset="100%" stop-color="#3A4A5C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Circuit board pattern -->
    <pattern id="circuit" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M0 32h20M44 32h20M32 0v20M32 44v20" stroke="#1A2A3A" stroke-width="1" fill="none" opacity="0.5"/>
      <circle cx="32" cy="32" r="2" fill="#1A2A3A" opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#1A2A3A" opacity="0.3"/>
      <circle cx="64" cy="0" r="1.5" fill="#1A2A3A" opacity="0.3"/>
      <circle cx="0" cy="64" r="1.5" fill="#1A2A3A" opacity="0.3"/>
      <circle cx="64" cy="64" r="1.5" fill="#1A2A3A" opacity="0.3"/>
      <path d="M20 32h4l4-8h4l4 8h4" stroke="#1A2A3A" stroke-width="0.8" fill="none" opacity="0.3"/>
      <path d="M32 20v4l-8 4v4l8 4v4" stroke="#1A2A3A" stroke-width="0.8" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Outer border (glass frame) -->
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#border)" opacity="0.4"/>
  <!-- Main background -->
  <rect x="16" y="16" width="480" height="480" rx="88" ry="88" fill="url(#bg)"/>
  <!-- Circuit overlay -->
  <rect x="16" y="16" width="480" height="480" rx="88" ry="88" fill="url(#circuit)"/>
  <!-- Horizontal light flare -->
  <rect x="60" y="248" width="392" height="2" rx="1" fill="#A0D4FF" opacity="0.15"/>
  <!-- Glow text: OS -->
  <text x="220" y="310" font-family="Inter, system-ui, sans-serif" font-weight="300" font-size="160" fill="#B8DEFF" filter="url(#glow-strong)" opacity="0.9">OS</text>
  <!-- Superscript 3 -->
  <text x="380" y="240" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="80" fill="#B8DEFF" filter="url(#glow)">³</text>
</svg>
